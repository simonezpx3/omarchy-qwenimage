name: QIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust Bridge Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: rust-bridge

      - name: Cargo Check
        run: |
          cd rust-bridge
          cargo check --verbose

      - name: Cargo Clippy
        run: |
          cd rust-bridge
          cargo clippy -- -D warnings

  scripts-and-manifest:
    name: Shell Scripts & Manifest Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ShellCheck & jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Lint Shell Scripts
        run: |
          shellcheck install.sh
          shellcheck uninstall.sh
          shellcheck scripts/qis-stack.sh

      - name: Validate Manifest JSON
        run: |
          jq empty manifest.json
          echo "manifest.json is valid JSON"

      - name: Check Executable Permissions
        run: |
          test -x install.sh || (echo "install.sh must be executable" && exit 1)
          test -x uninstall.sh || (echo "uninstall.sh must be executable" && exit 1)
          test -x scripts/qis-stack.sh || (echo "scripts/qis-stack.sh must be executable" && exit 1)
          echo "All entrypoint scripts are executable"
