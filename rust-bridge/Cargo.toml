[package]
name = "qwen_bridge"
version = "1.2.7"
edition = "2021"

[build-dependencies]
serde_json = "1.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "3.4.2", features = ["json"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "url"] }
data-encoding = "2.11.1"
fs2 = "0.4.3"
libc = "0.2.190"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
overflow-checks = false
